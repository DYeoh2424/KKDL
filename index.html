<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷酷的蓝比赛专用 - 点数版</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        :root {
            --darkest: #0a2b1e;
            --darker: #0f3d2c;
            --dark: #14523d;
            --dark-row: #0f402e;
            --accent: #22c55e;
            --accent-light: #86efac;
            --text: #ffffff;
            --muted: #88c9a8;
            --btn-plus: #22c55e;
            --btn-minus: #ef4444;
            --highlight-bg: #423d10;
            --border-hl: #facc15;
            --yellow: #facc15;
            --red: #ef4444;
            --green: #22c55e;
        }
        html, body {
            background: var(--darkest);
            color: var(--text);
            min-height: 100vh;
            overflow-y: auto;
        }
        header {
            background: var(--darker);
            padding: 14px 24px;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header-title { font-size: 1.5rem; color: var(--accent-light); font-weight: bold; text-align: center; }
        main {
            display: flex;
            flex-wrap: wrap;
            padding: 20px;
            gap: 24px;
        }
        .panel {
            background: var(--darker);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--dark);
            flex: 1 1 520px;
        }
        .panel-title {
            font-size: 1.3rem;
            color: var(--accent-light);
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .clear-btn {
            padding: 6px 14px;
            background: var(--btn-minus);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .gift-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
        .gift-row {
            background: var(--dark);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
            flex-wrap: wrap;
        }
        .gift-row.highlighted {
            background: var(--highlight-bg);
            border: 1px solid var(--border-hl);
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.25);
        }
        .mark-btn {
            width: 26px; height: 26px; border-radius: 50%; border: none;
            background: #1e3a30; color: #777; cursor: pointer;
            font-weight: bold; font-size: 14px;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .mark-btn.active { background: var(--yellow); color: #000; }
        .gift-name { flex: 1; font-size: 1rem; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
        .gift-points { font-size: 0.85rem; color: var(--muted); margin-left: 4px; }
        .emoji { font-size: 1.15rem; }
        .qty-input {
            width: 80px; padding: 8px 6px;
            background: var(--darkest); border: 2px solid var(--accent);
            color: var(--text); border-radius: 6px;
            text-align: center; font-size: 1rem;
            -moz-appearance: textfield; outline: none;
        }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .btn-group { display: flex; gap: 4px; margin-left: 4px; }
        .btn-round {
            width: 30px; height: 30px; border-radius: 50%; border: none;
            color: white; font-size: 1rem; font-weight: bold; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .btn-plus { background: var(--btn-plus); }
        .btn-minus { background: var(--btn-minus); }
        .total-box {
            margin-top: 18px; padding: 14px 20px;
            background: var(--dark); border-radius: 10px;
            font-size: 1.15rem; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
            border: 2px solid var(--accent);
        }
        .goals-section { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
        .goals-title { font-size: 1.1rem; color: var(--accent-light); font-weight: bold; margin-bottom: 4px; }
        .goal-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; background: var(--dark); border-radius: 8px;
            transition: all 0.3s; flex-wrap: wrap; gap: 8px;
        }
        .goal-row.unlocked { background: #166534; border: 1px solid #22c55e; }
        .goal-name { font-size: 0.95rem; }
        .goal-name input {
            background: transparent; border: none; color: var(--text);
            font-size: 0.95rem; outline: none; width: 110px;
        }
        .goal-target { text-align: center; color: var(--text); font-weight: 500; }
        .goal-target input {
            background: var(--darkest); border: 1px solid #2a7a5c;
            color: var(--text); text-align: center; width: 120px;
            padding: 4px 6px; border-radius: 4px; font-size: 0.95rem;
        }
        .goal-diff { font-weight: bold; text-align: right; }
        .goal-diff.negative { color: var(--red); }
        .goal-diff.unlocked-text { color: var(--green); font-weight: bold; }
        .add-goal-btn {
            margin-top: 8px; padding: 8px 14px;
            background: var(--dark); border: 1px solid var(--accent);
            color: var(--text); border-radius: 6px; cursor: pointer;
            align-self: flex-start;
        }
        .delete-goal-btn {
            background: transparent; border: none; color: var(--muted);
            cursor: pointer; margin-left: 8px; font-size: 1rem;
        }
        .sync-indicator {
            position: fixed; top: 10px; right: 10px;
            background: var(--accent); color: #000; padding: 6px 12px;
            border-radius: 20px; font-size: 0.85rem; font-weight: bold; z-index: 1000;
        }
        .sync-indicator.offline { background: var(--yellow); }
        .sync-indicator.error { background: var(--red); color: white; }
        .update-banner {
            position: fixed; top: 0; left: 0; right: 0;
            background: var(--yellow); color: #000; padding: 10px;
            text-align: center; font-weight: bold; z-index: 999; display: none;
        }
        .update-banner button {
            margin-left: 10px; padding: 5px 15px;
            background: var(--green); color: white; border: none;
            border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .right-panel { display: none; }
    </style>
</head>
<body>
    <div class="update-banner" id="updateBanner">
        🆕 New version available!
        <button onclick="location.reload()">Refresh Now</button>
    </div>
    <div class="sync-indicator" id="syncIndicator">⚡ Connecting...</div>

    <header>
        <h1 class="header-title">🏁 酷酷的蓝比赛专用 — 点数统计</h1>
    </header>

    <main>
        <div class="panel left-panel" style="max-width: 800px; margin: 0 auto;">
            <h2 class="panel-title">
                礼物清单
                <button class="clear-btn" onclick="clearAllGifts()">🗑️ 一键清空</button>
            </h2>
            <div class="gift-grid" id="giftGrid"></div>
            <div class="total-box">
                <span>总点数</span>
                <span id="grandTotal">0.0</span>
            </div>
            <div class="goals-section">
                <h3 class="goals-title">目标（点数）</h3>
                <div id="goalsContainer"></div>
                <button class="add-goal-btn" onclick="addGoalRow()">+ 添加目标</button>
            </div>
        </div>
    </main>

    <script>
        // ==================================================
        // 🔴 PASTE YOUR FIREBASE CONFIG HERE 🔴
        // ==================================================
        const firebaseConfig = {
          apiKey: "AIzaSyDUMKaG-iq6gSiVGnkWK7Aexf6A-6LvrKk",
          authDomain: "kkdl-856f4.firebaseapp.com",
          databaseURL: "https://kkdl-856f4.asia-southeast1.firebasedatabase.app",
          projectId: "kkdl-856f4",
          storageBucket: "kkdl-856f4.appspot.com",
          messagingSenderId: "1058958114658",
          appId: "1:1058958114658:web:c7ff68bc22e3ac5ea7b63b"
        };
        // ==================================================

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const stateRef = db.ref('shared_state');

        // ============== 礼物点数表 ==============
        const gifts = [
            { name: "兔兔", emoji: "🐰", points: 0.3 },
            { name: "宝箱", emoji: "🎁", points: 0.6 },
            { name: "跑车", emoji: "🚗", points: 1.2 },
            { name: "飞机", emoji: "✈️", points: 3.0 },
            { name: "邮轮", emoji: "🚢", points: 6.0 },
            { name: "火箭", emoji: "🚀", points: 10.0 },
            { name: "地雷", emoji: "💫", points: 18.8 },
            { name: "飞艇", emoji: "🛸", points: 20.0 },
            { name: "华华", emoji: "❀", points: 30.0 },
            { name: "10w+", emoji: "💎", points: 100.0 }
        ];

        let goals = [
            { id: 1, name: "目标1", target: 500.0 },
            { id: 2, name: "目标2", target: 1000.0 },
            { id: 3, name: "目标3", target: 2000.0 }
        ];
        let nextGoalId = 4;

        let quantities = {};
        let highlighted = {};
        gifts.forEach(g => {
            quantities[g.name] = 0;
            highlighted[g.name] = false;
        });

        let isSyncing = false;
        let localSaveTimeout = null;

        // ============== 同步状态 ==============
        function updateSyncStatus(status, text) {
            const el = document.getElementById('syncIndicator');
            el.className = 'sync-indicator ' + (status === 'online' ? '' : status);
            el.textContent = text;
        }

        function pushStateToFirebase() {
            if (isSyncing) return;
            clearTimeout(localSaveTimeout);
            localSaveTimeout = setTimeout(() => {
                const state = {
                    quantities, highlighted, goals, nextGoalId,
                    _ts: firebase.database.ServerValue.TIMESTAMP
                };
                stateRef.set(state).catch(err => {
                    console.error('Sync error:', err);
                    updateSyncStatus('error', '❌ Sync Error');
                });
            }, 300);
        }

        stateRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) {
                updateSyncStatus('online', '⚡ Live Sync');
                return;
            }
            isSyncing = true;
            try {
                quantities = data.quantities || quantities;
                highlighted = data.highlighted || highlighted;
                goals = data.goals || goals;
                nextGoalId = data.nextGoalId || nextGoalId;
                fullRender();
                updateSyncStatus('online', '⚡ Live Sync');
            } catch (e) {
                console.error('Load error:', e);
            }
            isSyncing = false;
        }, (err) => {
            updateSyncStatus('error', '❌ Disconnected');
        });

        db.ref('.info/connected').on('value', (snap) => {
            updateSyncStatus(snap.val() ? 'online' : 'offline', snap.val() ? '⚡ Live Sync' : '⏳ Offline...');
        });

        // ============== 计算总点数 ==============
        function getTotalPoints() {
            let total = 0;
            gifts.forEach(g => {
                total += g.points * (quantities[g.name] || 0);
            });
            return total;
        }

        function formatPoints(num) {
            return num.toFixed(2);
        }

        function updateGrandTotal() {
            document.getElementById("grandTotal").textContent = formatPoints(getTotalPoints());
        }

        // ============== 渲染 ==============
        function fullRender() {
            renderGiftGrid();
            updateGrandTotal();
            renderGoals(getTotalPoints());
        }

        function clearAllGifts() {
            gifts.forEach(g => quantities[g.name] = 0);
            pushStateToFirebase();
            fullRender();
        }

        function renderGiftGrid() {
            const grid = document.getElementById("giftGrid");
            if (grid.children.length === 0) {
                gifts.forEach(gift => {
                    const row = document.createElement("div");
                    row.className = `gift-row`;
                    row.id = `row-${gift.name}`;
                    row.innerHTML = `
                        <button class="mark-btn" id="mark-${gift.name}">!</button>
                        <span class="gift-name">
                            <span class="emoji">${gift.emoji}</span>
                            <span>${gift.name}</span>
                            <span class="gift-points">(${gift.points}点)</span>
                        </span>
                        <input type="number" class="qty-input" id="qty-${gift.name}"
                               min="0" max="9999">
                        <div class="btn-group">
                            <button class="btn-round btn-minus">−</button>
                            <button class="btn-round btn-plus">+</button>
                        </div>
                    `;
                    grid.appendChild(row);

                    const input = row.querySelector(`#qty-${gift.name}`);
                    input.addEventListener('input', (e) => {
                        let val = e.target.value;
                        quantities[gift.name] = val === '' || val === null ? 0 : Math.max(0, Math.min(9999, parseInt(val) || 0));
                        updateGrandTotal();
                        renderGoals(getTotalPoints());
                        pushStateToFirebase();
                    });

                    row.querySelector('.btn-minus').addEventListener('click', () => {
                        quantities[gift.name] = Math.max(0, (quantities[gift.name] || 0) - 1);
                        pushStateToFirebase();
                        fullRender();
                    });
                    row.querySelector('.btn-plus').addEventListener('click', () => {
                        quantities[gift.name] = Math.min(9999, (quantities[gift.name] || 0) + 1);
                        pushStateToFirebase();
                        fullRender();
                    });
                    row.querySelector('.mark-btn').addEventListener('click', () => {
                        highlighted[gift.name] = !highlighted[gift.name];
                        pushStateToFirebase();
                        fullRender();
                    });
                });
            }

            gifts.forEach(gift => {
                const row = document.getElementById(`row-${gift.name}`);
                const markBtn = document.getElementById(`mark-${gift.name}`);
                const input = document.getElementById(`qty-${gift.name}`);
                const targetVal = quantities[gift.name] || 0;
                const current = parseInt(input.value) || 0;

                if (current !== targetVal && document.activeElement !== input) {
                    input.value = targetVal;
                }
                row.classList.toggle('highlighted', highlighted[gift.name]);
                markBtn.classList.toggle('active', highlighted[gift.name]);
            });
        }

        function renderGoals(total) {
            const container = document.getElementById("goalsContainer");
            container.innerHTML = "";
            goals.forEach(goal => {
                const isUnlocked = total >= goal.target;
                const diff = goal.target - total;
                const row = document.createElement("div");
                row.className = `goal-row ${isUnlocked ? "unlocked" : ""}`;
                row.innerHTML = `
                    <span class="goal-name">
                        <input type="text" value="${goal.name}" data-id="${goal.id}">
                        ${goals.length > 1 ? `<button class="delete-goal-btn" data-id="${goal.id}">✕</button>` : ""}
                    </span>
                    <span class="goal-target">
                        <input type="number" step="0.01" value="${goal.target}" data-id="${goal.id}">
                    </span>
                    <span class="goal-diff ${isUnlocked ? "unlocked-text" : "negative"}">
                        ${isUnlocked ? "已解锁 ✅" : `−${formatPoints(diff)}`}
                    </span>
                `;
                container.appendChild(row);
            });

            container.querySelectorAll('.goal-name input').forEach(inp => {
                inp.addEventListener('change', (e) => {
                    const g = goals.find(x => x.id === parseInt(e.target.dataset.id));
                    if (g) { g.name = e.target.value; pushStateToFirebase(); }
                });
            });
            container.querySelectorAll('.goal-target input').forEach(inp => {
                inp.addEventListener('change', (e) => {
                    const g = goals.find(x => x.id === parseInt(e.target.dataset.id));
                    if (g) { g.target = Math.max(0, parseFloat(e.target.value) || 0); pushStateToFirebase(); renderGoals(getTotalPoints()); }
                });
            });
            container.querySelectorAll('.delete-goal-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    goals = goals.filter(x => x.id !== parseInt(btn.dataset.id));
                    pushStateToFirebase(); renderGoals(getTotalPoints());
                });
            });
        }

        function addGoalRow() {
            goals.push({ id: nextGoalId++, name: "新目标", target: 0.0 });
            pushStateToFirebase();
            renderGoals(getTotalPoints());
        }

        // ============== 自动更新检测 ==============
        let lastETag = '';
        async function checkForUpdate() {
            try {
                const res = await fetch(location.href, { cache: 'no-store' });
                const etag = res.headers.get('etag') || res.headers.get('last-modified') || '';
                if (lastETag && etag && etag !== lastETag) {
                    document.getElementById('updateBanner').style.display = 'block';
                }
                if (!lastETag) lastETag = etag;
            } catch {}
        }
        setInterval(checkForUpdate, 3000);

        // ============== 初始化 ==============
        document.addEventListener("DOMContentLoaded", () => {
            fullRender();
        });
    </script>
</body>
</html>

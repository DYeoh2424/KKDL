<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷酷的蓝比赛专用</title>
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Microsoft YaHei", sans-serif; }
        :root {
            --bg-main: #052b1a;
            --panel-bg: #0a3d28;
            --panel-border: #22c55e;
            --text: #ffffff;
            --text-dim: #99ccaa;
            --btn-minus: #ef4444;
            --btn-plus: #22c55e;
            --btn-clear: #ef4444;
            --input-bg: #052b1a;
            --input-border: #22c55e;
            --row-even: #0f4d34;
            --row-odd: #0a3d28;
            --red: #ff6666;
            --green: #66ff66;
            --highlight: #155e3a;
        }
        body {
            background: var(--bg-main);
            color: var(--text);
            min-height: 100vh;
            padding: 16px;
        }
        .page-title {
            text-align: center;
            font-size: 1.5rem;
            margin-bottom: 16px;
            color: var(--panel-border);
        }
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        .panel {
            background: var(--panel-bg);
            border: 2px solid var(--panel-border);
            border-radius: 12px;
            padding: 20px;
        }
        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .panel-title {
            font-size: 1.25rem;
            color: var(--panel-border);
        }
        .clear-btn {
            background: var(--btn-clear);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .gift-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .gift-item {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--row-odd);
            padding: 10px 12px;
            border-radius: 8px;
        }
        .mark-btn {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            border: none;
            background: #1a5238;
            color: var(--panel-border);
            font-weight: bold;
            cursor: pointer;
            flex-shrink: 0;
        }
        .gift-name {
            flex: 1;
            font-size: 1rem;
        }
        .qty-input {
            width: 50px;
            padding: 6px;
            text-align: center;
            background: var(--input-bg);
            border: 2px solid var(--input-border);
            color: white;
            border-radius: 6px;
            font-size: 1rem;
        }
        .qty-btn {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 1rem;
            cursor: pointer;
            margin-left: 4px;
        }
        .minus { background: var(--btn-minus); }
        .plus { background: var(--btn-plus); }
        .total-row {
            background: var(--highlight);
            padding: 14px 16px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            border: 2px solid var(--panel-border);
        }
        .goals-section h3 {
            color: var(--panel-border);
            margin-bottom: 12px;
            font-size: 1rem;
        }
        .goal-row {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 0;
            border-bottom: 1px solid #1a5238;
        }
        .goal-name { flex: 1; }
        .goal-input {
            width: 120px;
            padding: 6px;
            background: var(--input-bg);
            border: 1px solid var(--input-border);
            color: white;
            border-radius: 4px;
            text-align: center;
        }
        .goal-diff {
            width: 100px;
            text-align: right;
            font-weight: bold;
        }
        .diff-negative { color: var(--red); }
        .diff-positive { color: var(--green); }
        .add-goal-btn {
            margin-top: 12px;
            background: var(--btn-plus);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
        }
        /* 档位周边 Panel */
        .toggle-row {
            display: flex;
            gap: 20px;
            margin-bottom: 12px;
        }
        .toggle-option {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }
        .select-label {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: var(--text-dim);
        }
        .gift-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 20px;
        }
        .gift-tag {
            background: var(--highlight);
            border: 1px solid var(--panel-border);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .gift-tag.selected {
            background: var(--panel-border);
            color: #000;
        }
        .peripheral-table {
            width: 100%;
            border-collapse: collapse;
        }
        .peripheral-table th,
        .peripheral-table td {
            padding: 10px 12px;
            text-align: left;
            border-bottom: 1px solid #1a5238;
        }
        .peripheral-table th {
            color: var(--panel-border);
        }
        .sync-status {
            position: fixed; top: 8px; right: 8px;
            background: var(--highlight);
            color: var(--panel-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div class="sync-status" id="syncStatus">⚡ 连接中...</div>

    <h1 class="page-title">🏁 酷酷的蓝比赛专用</h1>

    <div class="container">
        <!-- 礼物清单 Panel -->
        <div class="panel">
            <div class="panel-header">
                <h2 class="panel-title">礼物清单</h2>
                <button class="clear-btn" onclick="clearAll()">🗑️ 一键清空</button>
            </div>

            <div class="gift-grid" id="giftGrid"></div>

            <div class="total-row">
                <span>总值</span>
                <span id="grandTotal">0.0</span>
            </div>

            <div class="goals-section">
                <h3>目标</h3>
                <div id="goalsContainer">
                    <div class="goal-row">
                        <span class="goal-name">爱心手幅</span>
                        <input type="number" step="0.1" class="goal-input" value="888.0">
                        <span class="goal-diff diff-negative">-888.0</span>
                    </div>
                    <div class="goal-row">
                        <span class="goal-name">吧唧</span>
                        <input type="number" step="0.1" class="goal-input" value="1888.0">
                        <span class="goal-diff diff-negative">-1888.0</span>
                    </div>
                    <div class="goal-row">
                        <span class="goal-name">眼睛条</span>
                        <input type="number" step="0.1" class="goal-input" value="2888.0">
                        <span class="goal-diff diff-negative">-2888.0</span>
                    </div>
                </div>
                <button class="add-goal-btn" onclick="addGoal()">+ 添加目标</button>
            </div>
        </div>

        <!-- 档位周边 Panel -->
        <div class="panel">
            <h2 class="panel-title" style="margin-bottom: 16px;">档位周边</h2>

            <div class="toggle-row">
                <label class="toggle-option">
                    <input type="radio" name="mode" value="min" checked onchange="updateMode()">
                    最少礼物数
                </label>
                <label class="toggle-option">
                    <input type="radio" name="mode" value="variety" onchange="updateMode()">
                    最多礼物种类
                </label>
            </div>

            <div class="select-label">包含礼物 (点击选择/取消):</div>
            <div class="gift-tags" id="giftTags"></div>

            <table class="peripheral-table">
                <thead>
                    <tr>
                        <th>档位</th>
                        <th>所需点数</th>
                        <th>可获得周边</th>
                        <th>礼物组合</th>
                    </tr>
                </thead>
                <tbody id="peripheralBody">
                    <!-- Filled by JS -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        // ==================================================
        // 🔴 YOUR FIREBASE CONFIG
        // ==================================================
        const firebaseConfig = {
            apiKey: "AIzaSyDUMKaG-iq6gSiVGnkWK7Aexf6A-6LvrKk",
            authDomain: "kkdl-856f4.firebaseapp.com",
            databaseURL: "https://kkdl-856f4.asia-southeast1.firebasedatabase.app",
            projectId: "kkdl-856f4",
            storageBucket: "kkdl-856f4.appspot.com",
            messagingSenderId: "1058958114658",
            appId: "1:1058958114658:web:c7ff68bc22e3ac5ea7b63b"
        };
        // ==================================================

        // Init Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const stateRef = db.ref('kkdl_state');

        // ===== GIFT DATA — exact names & point values =====
        const gifts = [
            { id: 'rabbit', name: '兔兔', emoji: '🐰', points: 0.3 },
            { id: 'box', name: '箱箱', emoji: '🎁', points: 0.6 },
            { id: 'car', name: '车车', emoji: '🚗', points: 1.2 },
            { id: 'plane', name: '飞飞', emoji: '✈️', points: 3.0 },
            { id: 'ship', name: '船船', emoji: '🚢', points: 6.0 },
            { id: 'rocket', name: '火箭', emoji: '🚀', points: 10.0 },
            { id: 'mine', name: '地雷', emoji: '💫', points: 18.8 },
            { id: 'boat', name: '艇艇', emoji: '🛸', points: 20.0 },
            { id: 'flower', name: '华华', emoji: '❀', points: 30.0 },
            { id: 'big', name: '10w+', emoji: '💎', points: 100.0 }
        ];

        // ===== 档位周边 =====
        const tiers = [
            { tier: 10, required: 100.0, reward: '徽章、立牌等' },
            { tier: 20, required: 300.0, reward: '徽章、立牌等' },
            { tier: 40, required: 500.0, reward: '徽章、立牌等' },
            { tier: 66, required: 800.0, reward: '徽章、立牌等' }
        ];

        // State
        let quantities = {};
        let highlighted = {};
        let selectedGifts = {};
        let goals = [
            { name: '爱心手幅', value: 888.0 },
            { name: '吧唧', value: 1888.0 },
            { name: '眼睛条', value: 2888.0 }
        ];
        let mode = 'min'; // 'min' or 'variety'
        let localUpdate = false;

        // Init defaults
        gifts.forEach(g => {
            quantities[g.id] = 0;
            highlighted[g.id] = false;
            selectedGifts[g.id] = true;
        });

        // Format: 1 decimal place
        function formatPoints(num) {
            return num.toFixed(1);
        }

        // Total points
        function getTotalPoints() {
            return gifts.reduce((sum, g) => sum + g.points * quantities[g.id], 0);
        }

        // Sync status
        function setSyncStatus(text) {
            document.getElementById('syncStatus').textContent = text;
        }

        // Push to Firebase
        function pushState() {
            localUpdate = true;
            stateRef.set({ quantities, highlighted, selectedGifts, goals, mode })
                .then(() => setSyncStatus('⚡ 实时同步'))
                .catch(() => setSyncStatus('⚠️ 同步失败'));
            setTimeout(() => localUpdate = false, 500);
        }

        // Listen from Firebase
        stateRef.on('value', (snap) => {
            const data = snap.val();
            if (!data) {
                setSyncStatus('⚡ 就绪');
                renderAll();
                return;
            }
            setSyncStatus('⚡ 实时同步');

            if (!localUpdate) {
                if (data.quantities) quantities = data.quantities;
                if (data.highlighted) highlighted = data.highlighted;
                if (data.selectedGifts) selectedGifts = data.selectedGifts;
                if (data.goals) goals = data.goals;
                if (data.mode) mode = data.mode;
            }
            renderAll();
        });

        // Calculate gift combination display
        function getComboText() {
            const selected = gifts.filter(g => selectedGifts[g.id]);
            if (mode === 'min') {
                // Show least number to reach total
                let rem = getTotalPoints();
                const used = [];
                for (const g of [...selected].sort((a,b)=>b.points-a.points)) {
                    const n = Math.floor(rem / g.points);
                    if (n > 0) {
                        used.push(`${n}${g.emoji}`);
                        rem -= n * g.points;
                    }
                }
                return used.join(', ') || '-';
            } else {
                // Show variety
                return selected.map(g => g.emoji).join(' ') || '-';
            }
        }

        // Render gift grid
        function renderGifts() {
            const grid = document.getElementById('giftGrid');
            grid.innerHTML = '';

            gifts.forEach(gift => {
                const item = document.createElement('div');
                item.className = `gift-item ${highlighted[gift.id] ? 'highlighted' : ''}`;
                item.innerHTML = `
                    <button class="mark-btn" data-id="${gift.id}">!</button>
                    <span class="gift-name">${gift.emoji} ${gift.name}</span>
                    <input type="number" class="qty-input" id="qty-${gift.id}" 
                           value="${quantities[gift.id]}" min="0">
                    <button class="qty-btn minus" data-id="${gift.id}" data-action="minus">−</button>
                    <button class="qty-btn plus" data-id="${gift.id}" data-action="plus">+</button>
                `;
                grid.appendChild(item);
            });

            // Mark buttons
            grid.querySelectorAll('.mark-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    highlighted[id] = !highlighted[id];
                    pushState();
                });
            });

            // +/- buttons
            grid.querySelectorAll('.qty-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const id = btn.dataset.id;
                    if (btn.dataset.action === 'plus') quantities[id]++;
                    else quantities[id] = Math.max(0, quantities[id] - 1);
                    pushState();
                });
            });

            // Direct input
            grid.querySelectorAll('.qty-input').forEach(input => {
                input.addEventListener('change', () => {
                    const id = input.id.replace('qty-', '');
                    quantities[id] = Math.max(0, parseInt(input.value) || 0);
                    input.value = quantities[id];
                    pushState();
                });
            });
        }

        // Render gift tags
        function renderTags() {
            const container = document.getElementById('giftTags');
            container.innerHTML = '';

            gifts.forEach(gift => {
                const tag = document.createElement('span');
                tag.className = `gift-tag ${selectedGifts[gift.id] ? 'selected' : ''}`;
                tag.textContent = `${gift.emoji} ${gift.name}`;
                tag.addEventListener('click', () => {
                    selectedGifts[gift.id] = !selectedGifts[gift.id];
                    pushState();
                });
                container.appendChild(tag);
            });
        }

        // Render goals
        function renderGoals() {
            const container = document.getElementById('goalsContainer');
            container.innerHTML = '';
            const total = getTotalPoints();

            goals.forEach((goal, idx) => {
                const diff = goal.value - total;
                const row = document.createElement('div');
                row.className = 'goal-row';
                row.innerHTML = `
                    <span class="goal-name">${goal.name}</span>
                    <input type="number" step="0.1" class="goal-input" value="${goal.value}" 
                           data-idx="${idx}">
                    <span class="goal-diff ${diff <= 0 ? 'diff-positive' : 'diff-negative'}">
                        ${diff <= 0 ? '+' : ''}${formatPoints(Math.abs(diff))}
                    </span>
                `;
                container.appendChild(row);
            });

            container.querySelectorAll('.goal-input').forEach(input => {
                input.addEventListener('change', () => {
                    const idx = parseInt(input.dataset.idx);
                    goals[idx].value = parseFloat(input.value) || 0;
                    pushState();
                });
            });
        }

        // Render peripheral table
        function renderPeripherals() {
            const tbody = document.getElementById('peripheralBody');
            tbody.innerHTML = '';
            const total = getTotalPoints();
            const comboText = getComboText();

            tiers.forEach(tier => {
                const achieved = total >= tier.required;
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${tier.tier}</td>
                    <td style="color:${achieved ? 'var(--green)' : 'inherit'}">${formatPoints(tier.required)}</td>
                    <td>${tier.reward}</td>
                    <td>${comboText}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Update mode
        function updateMode() {
            mode = document.querySelector('input[name="mode"]:checked').value;
            pushState();
        }

        // Add new goal
        function addGoal() {
            const name = prompt('请输入目标名称:');
            if (!name) return;
            const val = parseFloat(prompt('请输入目标点数:')) || 0;
            goals.push({ name, value: val });
            pushState();
        }

        // Clear all
        function clearAll() {
            if (!confirm('确定全部清零吗？')) return;
            gifts.forEach(g => quantities[g.id] = 0);
            highlighted = {};
            pushState();
        }

        // Main render
        function renderAll() {
            renderGifts();
            renderTags();
            renderGoals();
            renderPeripherals();
            document.getElementById('grandTotal').textContent = formatPoints(getTotalPoints());
            
            // Sync radio buttons
            document.querySelector(`input[name="mode"][value="${mode}"]`).checked = true;
        }

        // Start
        renderAll();
    </script>
</body>
</html>

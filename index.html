<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>酷酷的蓝比赛专用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft YaHei", sans-serif;
        }
        :root {
            --darkest: #0a2b1e;
            --darker: #0f3d2c;
            --dark: #14523d;
            --dark-row: #0f402e;
            --accent: #22c55e;
            --accent-light: #86efac;
            --text: #ffffff;
            --muted: #88c9a8;
            --btn-plus: #22c55e;
            --btn-minus: #ef4444;
            --highlight-bg: #423d10;
            --border-hl: #facc15;
            --yellow: #facc15;
            --red: #ef4444;
            --green: #22c55e;
        }
        body {
            background: var(--darkest);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }
        header {
            background: var(--darker);
            padding: 14px 24px;
            border-bottom: 2px solid var(--accent);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .header-title {
            font-size: 1.5rem;
            color: var(--accent-light);
            font-weight: bold;
        }
        main {
            display: flex;
            height: 100vh;
            padding: 20px;
            gap: 24px;
        }
        .panel {
            background: var(--darker);
            border-radius: 16px;
            padding: 24px;
            border: 1px solid var(--dark);
        }
        .left-panel {
            flex: 0 0 580px;
            display: flex;
            flex-direction: column;
        }
        .right-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 1.3rem;
            color: var(--accent-light);
            margin-bottom: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .clear-btn {
            padding: 6px 14px;
            background: var(--btn-minus);
            border: none;
            border-radius: 6px;
            color: white;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .gift-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }
        .gift-row {
            background: var(--dark);
            border-radius: 12px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s;
        }
        .gift-row.highlighted {
            background: var(--highlight-bg);
            border: 1px solid var(--border-hl);
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.25);
        }
        .mark-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: none;
            background: #1e3a30;
            color: #777;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .mark-btn.active {
            background: var(--yellow);
            color: #000;
        }
        .gift-name {
            flex: 1;
            font-size: 1rem;
            display: flex;
            align-items: center;
            gap: 4px;
            white-space: nowrap;
        }
        .emoji {
            font-size: 1.15rem;
        }
        .qty-input {
            width: 80px;
            padding: 8px 6px;
            background: var(--darkest);
            border: 2px solid var(--accent);
            color: var(--text);
            border-radius: 6px;
            text-align: center;
            font-size: 1rem;
            -moz-appearance: textfield;
            outline: none;
        }
        .qty-input::-webkit-outer-spin-button,
        .qty-input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .btn-group {
            display: flex;
            gap: 4px;
            margin-left: 4px;
        }
        .btn-round {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .btn-plus { background: var(--btn-plus); }
        .btn-minus { background: var(--btn-minus); }
        .total-box {
            margin-top: 18px;
            padding: 14px 20px;
            background: var(--dark);
            border-radius: 10px;
            font-size: 1.15rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 2px solid var(--accent);
        }
        .goals-section {
            margin-top: 18px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .goals-title {
            font-size: 1.1rem;
            color: var(--accent-light);
            font-weight: bold;
            margin-bottom: 4px;
        }
        .goal-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--dark);
            border-radius: 8px;
            transition: all 0.3s;
        }
        .goal-row.unlocked {
            background: #166534;
            border: 1px solid #22c55e;
        }
        .goal-name {
            font-size: 0.95rem;
        }
        .goal-name input {
            background: transparent;
            border: none;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
            width: 110px;
        }
        .goal-target {
            text-align: center;
            color: var(--text);
            font-weight: 500;
        }
        .goal-target input {
            background: var(--darkest);
            border: 1px solid #2a7a5c;
            color: var(--text);
            text-align: center;
            width: 120px;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .goal-diff {
            font-weight: bold;
            width: 120px;
            text-align: right;
        }
        .goal-diff.negative { color: var(--red); }
        .goal-diff.unlocked-text { 
            color: var(--green); 
            font-weight: bold;
        }
        .add-goal-btn {
            margin-top: 8px;
            padding: 8px 14px;
            background: var(--dark);
            border: 1px solid var(--accent);
            color: var(--text);
            border-radius: 6px;
            cursor: pointer;
            align-self: flex-start;
        }
        .strategy-bar {
            margin-bottom: 16px;
            display: flex;
            gap: 24px;
            align-items: center;
        }
        .radio-label {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            font-size: 1rem;
        }
        .filter-section {
            margin-bottom: 20px;
        }
        .filter-label {
            margin-bottom: 10px;
            display: block;
            color: var(--muted);
        }
        .multi-select {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        .tag {
            padding: 8px 14px;
            background: var(--dark);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.95rem;
            border: 2px solid transparent;
            transition: all 0.2s;
            white-space: nowrap;
        }
        .tag.selected {
            background: var(--accent);
            color: #000;
            border-color: var(--accent-light);
        }
        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 8px;
            margin-top: 10px;
        }
        th {
            background: var(--dark);
            color: var(--accent-light);
            padding: 12px 14px;
            text-align: left;
            font-weight: 600;
        }
        td {
            padding: 12px 14px;
            background: var(--dark-row);
        }
        tr td:first-child { border-radius: 8px 0 0 8px; }
        tr td:last-child { border-radius: 0 8px 8px 0; }
        td input {
            width: 100%;
            padding: 8px 10px;
            background: var(--darkest);
            border: 1px solid #2a7a5c;
            color: var(--text);
            border-radius: 4px;
            font-size: 0.95rem;
        }
        .gift-combo {
            line-height: 1.5;
        }
        .delete-goal-btn {
            background: transparent;
            border: none;
            color: var(--muted);
            cursor: pointer;
            margin-left: 8px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <h1 class="header-title">🏁 酷酷的蓝比赛专用</h1>
    </header>

    <main>
        <!-- Left Panel - Gift List -->
        <div class="panel left-panel">
            <h2 class="panel-title">
                礼物清单
                <button class="clear-btn" onclick="clearAllGifts()">🗑️ 一键清空</button>
            </h2>
            <div class="gift-grid" id="giftGrid"></div>
            <div class="total-box">
                <span>总数</span>
                <span id="grandTotal">0</span>
            </div>
            <!-- Goals Section -->
            <div class="goals-section">
                <h3 class="goals-title">目标</h3>
                <div id="goalsContainer"></div>
                <button class="add-goal-btn" onclick="addGoalRow()">+ 添加目标</button>
            </div>
        </div>

        <!-- Right Panel - Tier Table -->
        <div class="panel right-panel">
            <h2 class="panel-title">档位周边</h2>
            
            <div class="strategy-bar">
                <label class="radio-label">
                    <input type="radio" name="strategy" value="fewest" checked onchange="renderTierTable()">
                    最少礼物数
                </label>
                <label class="radio-label">
                    <input type="radio" name="strategy" value="mosttypes" onchange="renderTierTable()">
                    最多礼物种类
                </label>
            </div>
            
            <div class="filter-section">
                <span class="filter-label">包含礼物 (点击选择/取消):</span>
                <div class="multi-select" id="giftTags"></div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th style="width:15%">档位</th>
                        <th style="width:20%">所需钻石</th>
                        <th style="width:30%">可获得周边</th>
                        <th style="width:35%">礼物组合</th>
                    </tr>
                </thead>
                <tbody id="tierBody"></tbody>
            </table>
        </div>
    </main>

    <script>
        // Gift data
        const gifts = [
            { name: "兔兔", emoji: "🐰", value: 299 },
            { name: "箱箱", emoji: "🎁", value: 600 },
            { name: "车车", emoji: "🚗", value: 1200 },
            { name: "飞飞", emoji: "✈️", value: 3000 },
            { name: "船船", emoji: "🚢", value: 6000 },
            { name: "火箭", emoji: "🚀", value: 10001 },
            { name: "地雷", emoji: "💫", value: 18888 },
            { name: "艇艇", emoji: "🛸", value: 20000 },
            { name: "华华", emoji: "❀", value: 30000 },
            { name: "10w+", emoji: "💎", value: 100000 }
        ];

        // Goals data
        let goals = [
            { id: 1, name: "爱心手幅", target: 888000 },
            { id: 2, name: "吧唧", target: 1888000 },
            { id: 3, name: "眼睛条", target: 2888000 }
        ];
        let nextGoalId = 4;

        let quantities = {};
        let highlighted = {};
        let selectedGifts = {};
        gifts.forEach(g => {
            quantities[g.name] = 0;
            highlighted[g.name] = false;
            selectedGifts[g.name] = true;
        });

        // Tier data
        let tiers = [
            { tier: 10, diamonds: 2990, reward: "" },
            { tier: 20, diamonds: 5980, reward: "" },
            { tier: 40, diamonds: 11960, reward: "" },
            { tier: 66, diamonds: 19734, reward: "" }
        ];

        // Clear all gift counts
        function clearAllGifts() {
            gifts.forEach(g => quantities[g.name] = 0);
            gifts.forEach(g => {
                const input = document.getElementById(`qty-${g.name}`);
                if (input) input.value = 0;
            });
            updateGrandTotal();
            renderGoals(getGrandTotal());
        }

        // Render gift grid — keep focus
        function renderGiftGrid() {
            const grid = document.getElementById("giftGrid");
            if (grid.children.length === 0) {
                gifts.forEach(gift => {
                    const row = document.createElement("div");
                    row.className = `gift-row`;
                    row.id = `row-${gift.name}`;
                    row.innerHTML = `
                        <button class="mark-btn" id="mark-${gift.name}" onclick="toggleHighlight('${gift.name}')">!</button>
                        <span class="gift-name">
                            <span class="emoji">${gift.emoji}</span>
                            <span>${gift.name}</span>
                        </span>
                        <input type="number" class="qty-input" id="qty-${gift.name}" 
                               min="0" max="9999" value="${quantities[gift.name]}">
                        <div class="btn-group">
                            <button class="btn-round btn-minus" onclick="changeQty('${gift.name}', -1)">−</button>
                            <button class="btn-round btn-plus" onclick="changeQty('${gift.name}', 1)">+</button>
                        </div>
                    `;
                    grid.appendChild(row);
                    
                    const input = document.getElementById(`qty-${gift.name}`);
                    input.addEventListener('input', (e) => {
                        updateQty(gift.name, e.target.value);
                    });
                });
            }
            
            gifts.forEach(gift => {
                const row = document.getElementById(`row-${gift.name}`);
                const markBtn = document.getElementById(`mark-${gift.name}`);
                if (highlighted[gift.name]) {
                    row.classList.add('highlighted');
                    markBtn.classList.add('active');
                } else {
                    row.classList.remove('highlighted');
                    markBtn.classList.remove('active');
                }
            });
        }

        function toggleHighlight(name) {
            highlighted[name] = !highlighted[name];
            renderGiftGrid();
        }

        // Render goals
        function renderGoals(total) {
            const container = document.getElementById("goalsContainer");
            container.innerHTML = "";
            
            goals.forEach(goal => {
                const isUnlocked = total >= goal.target;
                const diff = goal.target - total;
                
                const row = document.createElement("div");
                row.className = `goal-row ${isUnlocked ? "unlocked" : ""}`;
                row.innerHTML = `
                    <span class="goal-name">
                        <input type="text" value="${goal.name}" 
                               onchange="updateGoalName(${goal.id}, this.value)">
                        ${goals.length > 1 ? `<button class="delete-goal-btn" onclick="deleteGoal(${goal.id})">✕</button>` : ""}
                    </span>
                    <span class="goal-target">
                        <input type="number" value="${goal.target}" 
                               onchange="updateGoalTarget(${goal.id}, +this.value)">
                    </span>
                    <span class="goal-diff ${isUnlocked ? "unlocked-text" : "negative"}">
                        ${isUnlocked ? "已解锁" : `-${diff.toLocaleString()}`}
                    </span>
                `;
                container.appendChild(row);
            });
        }

        function addGoalRow() {
            goals.push({ id: nextGoalId++, name: "新目标", target: 0 });
            updateGrandTotal();
            renderGoals(getGrandTotal());
        }

        function deleteGoal(id) {
            if (goals.length > 1) {
                goals = goals.filter(g => g.id !== id);
                updateGrandTotal();
                renderGoals(getGrandTotal());
            }
        }

        function updateGoalName(id, name) {
            const g = goals.find(x => x.id === id);
            if (g) g.name = name;
        }

        function updateGoalTarget(id, target) {
            const g = goals.find(x => x.id === id);
            if (g) g.target = Math.max(0, target);
            updateGrandTotal();
            renderGoals(getGrandTotal());
        }

        // Render gift selection tags
        function renderGiftTags() {
            const container = document.getElementById("giftTags");
            if (!container) return;
            container.innerHTML = "";
            gifts.forEach(g => {
                const tag = document.createElement("span");
                tag.className = `tag ${selectedGifts[g.name] ? "selected" : ""}`;
                tag.textContent = `${g.emoji} ${g.name}`;
                tag.onclick = () => {
                    selectedGifts[g.name] = !selectedGifts[g.name];
                    renderGiftTags();
                    renderTierTable();
                };
                container.appendChild(tag);
            });
        }

        function updateQty(name, val) {
            if (val === '' || val === null) {
                quantities[name] = 0;
            } else {
                let v = parseInt(val);
                if (isNaN(v)) v = 0;
                v = Math.max(0, Math.min(9999, v));
                quantities[name] = v;
            }
            updateGrandTotal();
            renderGoals(getGrandTotal());
        }

        function changeQty(name, delta) {
            quantities[name] = Math.max(0, Math.min(9999, quantities[name] + delta));
            const input = document.getElementById(`qty-${name}`);
            if (input) input.value = quantities[name];
            updateGrandTotal();
            renderGoals(getGrandTotal());
        }

        function getGrandTotal() {
            let total = 0;
            gifts.forEach(g => total += g.value * quantities[g.name]);
            return total;
        }

        function updateGrandTotal() {
            document.getElementById("grandTotal").textContent = getGrandTotal().toLocaleString();
        }

        // Get selected gifts only
        function getSelectedGiftsList() {
            return gifts.filter(g => selectedGifts[g.name]);
        }

        // Find closest combination — total >= target
        function findClosestCombo(target, pool, strategy) {
            if (pool.length === 0) return { items: [], total: 0 };
            
            if (strategy === "fewest") {
                const sortedDesc = [...pool].sort((a, b) => b.value - a.value);
                // Single gift within +500
                const covers = pool.filter(g => g.value >= target && g.value - target <= 500);
                if (covers.length > 0) {
                    const best = covers.sort((a, b) => a.value - b.value)[0];
                    return { items: [{ gift: best, count: 1 }], total: best.value };
                }
                
                let remaining = target;
                const items = [];
                for (const g of sortedDesc) {
                    if (remaining <= 0) break;
                    if (g.value <= remaining) {
                        const n = Math.floor(remaining / g.value);
                        items.push({ gift: g, count: n });
                        remaining -= n * g.value;
                    }
                }
                
                if (remaining <= 0) {
                    return { items, total: target - remaining };
                }
                
                const coverRemainder = pool.filter(g => g.value >= remaining).sort((a, b) => a.value - b.value)[0];
                if (coverRemainder) {
                    items.push({ gift: coverRemainder, count: 1 });
                    return { items, total: target - remaining + coverRemainder.value };
                }
                
                const fullCover = pool.filter(g => g.value >= target).sort((a, b) => a.value - b.value)[0];
                if (fullCover) {
                    return { items: [{ gift: fullCover, count: 1 }], total: fullCover.value };
                }
                
                const largest = sortedDesc[0];
                const need = Math.ceil(target / largest.value);
                return { items: [{ gift: largest, count: need }], total: need * largest.value };
            } else {
                // Most types strategy
                const sortedAsc = [...pool].sort((a, b) => a.value - b.value);
                let remaining = target;
                const items = [];
                for (const g of sortedAsc) {
                    if (remaining >= g.value) {
                        items.push({ gift: g, count: 1 });
                        remaining -= g.value;
                    }
                }
                if (remaining > 0) {
                    const smallest = sortedAsc[0];
                    const need = Math.ceil(remaining / smallest.value);
                    const existing = items.find(i => i.gift.name === smallest.name);
                    if (existing) existing.count += need;
                    else items.push({ gift: smallest, count: need });
                }
                const totalVal = items.reduce((sum, i) => sum + i.gift.value * i.count, 0);
                return { items, total: totalVal };
            }
        }

        function buildCombo(target, strategy) {
            if (target <= 0) return "—";
            const pool = getSelectedGiftsList();
            if (pool.length === 0) return "请先选择礼物";

            const result = findClosestCombo(target, pool, strategy);
            const grouped = {};
            result.items.forEach(it => {
                grouped[it.gift.emoji] = (grouped[it.gift.emoji] || 0) + it.count;
            });
            return Object.entries(grouped).map(([emoji, n]) => `${n}${emoji}`).join(", ");
        }

        function renderTierTable() {
            const strategy = document.querySelector('input[name="strategy"]:checked')?.value || "fewest";
            const tbody = document.getElementById("tierBody");
            if (!tbody) return;
            tbody.innerHTML = "";

            tiers.forEach((tier, idx) => {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td><input type="number" value="${tier.tier}" 
                        onchange="tiers[${idx}].tier = +this.value; renderTierTable();"></td>
                    <td><input type="number" value="${tier.diamonds}" 
                        onchange="tiers[${idx}].diamonds = +this.value; renderTierTable();"></td>
                    <td><input type="text" value="${tier.reward}" 
                        placeholder="如：徽章、立牌等"
                        onchange="tiers[${idx}].reward = this.value;"></td>
                    <td class="gift-combo">${buildCombo(tier.diamonds, strategy)}</td>
                `;
                tbody.appendChild(row);
            });
        }

        // Initialize
        document.addEventListener("DOMContentLoaded", () => { 
            renderGiftGrid();
            renderGiftTags();
            renderTierTable();
            updateGrandTotal();
            renderGoals(getGrandTotal());
        });
    </script>
</body>
</html>
